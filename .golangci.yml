version: "2"

# Baseline linter set — catches real bugs without blocking on style or
# legacy patterns. Additional linters (errcheck, gocritic, gosec, revive)
# will be enabled incrementally via dedicated cleanup tickets.

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - depguard
  settings:
    depguard:
      rules:
        allowlist:
          allow:
          - $gostd
          - charm.land/bubbles/v2
          - charm.land/bubbletea/v2
          - charm.land/lipgloss/v2
          - github.com/RenseiAI/tui-components
          - github.com/atotto/clipboard
          - github.com/aymanbagabas/go-osc52/v2
          - github.com/aymanbagabas/go-udiff
          - github.com/bradleyjkemp/cupaloy/v2
          - github.com/charmbracelet/colorprofile
          - github.com/charmbracelet/harmonica
          - github.com/charmbracelet/lipgloss
          - github.com/charmbracelet/log
          - github.com/charmbracelet/ultraviolet
          - github.com/charmbracelet/x/ansi
          - github.com/charmbracelet/x/cellbuf
          - github.com/charmbracelet/x/exp/golden
          - github.com/charmbracelet/x/term
          - github.com/charmbracelet/x/termios
          - github.com/charmbracelet/x/windows
          - github.com/clipperhouse/displaywidth
          - github.com/clipperhouse/uax29/v2
          - github.com/davecgh/go-spew
          - github.com/go-logfmt/logfmt
          - github.com/lucasb-eyer/go-colorful
          - github.com/mattn/go-isatty
          - github.com/mattn/go-runewidth
          - github.com/muesli/cancelreader
          - github.com/muesli/termenv
          - github.com/pmezard/go-difflib
          - github.com/rivo/uniseg
          - github.com/sahilm/fuzzy
          - github.com/xo/terminfo
          - golang.org/x/exp
          - golang.org/x/sync
          - golang.org/x/sys

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
